<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Maintenance</title>

  <!-- Google Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

  <style>
    /* Global Reset & Solid Dark Grey Background */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a; /* Solid dark grey background */
      color: #ffffff;
      padding: 20px;
    }

    /* Simple Dark Card */
    .card {
      background-color: #242424;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Google Fonts No Entry Icon */
    .status-icon {
      font-size: 72px;
      color: #ff4d4d;
      margin-bottom: 16px;
      user-select: none;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #a0a0a0;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Fake Error Box */
    .error-box {
      background-color: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 14px 16px;
      text-align: left;
      margin-top: 10px;
      word-break: break-all;
    }

    .error-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: #777777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Monospace Code Style */
    .error-code {
      font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #ff6b6b;
      font-weight: 500;
    }

    .copy-btn {
      background-color: #2e2e2e;
      border: 1px solid #444444;
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .copy-btn:hover {
      background-color: #3d3d3d;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <main class="card">
    <!-- Google Material Icon for No Entry / Blocked -->
    <span class="material-symbols-outlined status-icon">
      block
    </span>

    <h1>This site is currently closed due to maintenance</h1>
    <p class="subtitle">We are performing scheduled updates to improve performance. Please check back shortly.</p>

    <!-- Realistic Copyable Error Box -->
    <div class="error-box">
      <div class="error-header">
        <span>Error flagged by creator:</span>
        <button class="copy-btn" onclick="copyError()">Copy Code</button>
      </div>
      <span class="error-code" id="errorCode">0x02583</span>
    </div>
  </main>

  <script>
    function copyError() {
      const errorText = document.getElementById("errorCode").innerText;
      navigator.clipboard.writeText(errorText);
      const btn = document.querySelector(".copy-btn");
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy Code", 2000);
    }
  </script>

</body>
</html>
